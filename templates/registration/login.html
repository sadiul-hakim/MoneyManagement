{% extends "base.html" %}

{% block title %}Login — MoneyFlow{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <div class="text-center mb-lg">
        <h1 class="page-title">MoneyFlow</h1>
        <div class="page-subtitle">Please sign in to continue</div>
    </div>

    {% if form.errors %}
    <div class="message message-error" style="margin-bottom: var(--space-md);">
        <span class="message-icon">⚠️</span>
        Your username and password didn't match. Please try again.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" class="form-input" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" class="form-input" autocomplete="current-password" required id="id_password">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
